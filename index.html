<title>مسابقة الدول والعواصم</title>


<style>

/* =====================================================
   الأساس
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b
        );

    min-height: 100vh;

    color: white;

    padding: 15px;

    overflow-x: hidden;
}

.container {

    width: 100%;

    max-width: 650px;

    margin: auto;
}


/* =====================================================
   العنوان
===================================================== */

h1 {

    text-align: center;

    font-size: 28px;

    margin:
        10px 0 18px;
}

.subtitle {

    text-align: center;

    color: #cbd5e1;

    margin-bottom: 20px;

    font-size: 16px;
}


/* =====================================================
   القائمة
===================================================== */

.menu {

    display: flex;

    flex-direction: column;

    gap: 12px;
}

.mode-button {

    width: 100%;

    border: none;

    border-radius: 18px;

    padding: 18px 15px;

    font-size: 18px;

    font-weight: bold;

    color: white;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    box-shadow:
        0 6px 15px
        rgba(0,0,0,.25);

    cursor: pointer;

    transition:
        transform .15s,
        opacity .15s;
}

.mode-button:active {

    transform: scale(.97);

    opacity: .85;
}


/* =====================================================
   اللعبة
===================================================== */

.game {

    display: none;
}


/* =====================================================
   الشريط العلوي
===================================================== */

.top-bar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    background:
        rgba(255,255,255,.08);

    border-radius: 16px;

    padding:
        12px 15px;

    margin-bottom: 15px;
}

.question-number {

    font-size: 16px;

    font-weight: bold;
}

.question-number span {

    direction: ltr;

    unicode-bidi: isolate;

    display: inline-block;
}

.score {

    font-size: 16px;

    font-weight: bold;
}


/* =====================================================
   صندوق السؤال
===================================================== */

.question-box {

    background:
        rgba(255,255,255,.08);

    border-radius: 22px;

    padding:
        25px 15px;

    text-align: center;

    margin-bottom: 15px;

    min-height: 180px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.20);
}

.question-title {

    font-size: 23px;

    font-weight: bold;

    margin-bottom: 18px;

    line-height: 1.5;
}

.flag {

    font-size: 75px;

    line-height: 1.2;

    margin:
        5px 0 10px;
}

.question-country {

    font-size: 30px;

    font-weight: bold;

    color: #facc15;
}

.question-capital {

    font-size: 27px;

    font-weight: bold;

    color: #facc15;
}


/* =====================================================
   الاختيارات
===================================================== */

.answers {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

    margin-top: 15px;
}

.answer {

    border: none;

    border-radius: 18px;

    min-height: 75px;

    padding: 12px;

    font-size: 18px;

    font-weight: bold;

    color: #0f172a;

    background: white;

    cursor: pointer;

    transition:
        transform .15s,
        background .2s,
        color .2s;
}

.answer:active {

    transform: scale(.96);
}

.answer.flag-answer {

    font-size: 48px;

    line-height: 1;
}

.answer.correct {

    background: #22c55e;

    color: white;
}

.answer.wrong {

    background: #ef4444;

    color: white;
}

.answer.disabled {

    pointer-events: none;
}


/* =====================================================
   التصحيح
===================================================== */

.correction {

    min-height: 75px;

    text-align: center;

    margin-top: 15px;

    font-size: 18px;

    font-weight: bold;

    line-height: 1.8;
}

.correct-message {

    color: #4ade80;

    font-size: 20px;
}

.wrong-message {

    color: #f87171;

    font-size: 20px;
}

.correct-answer {

    color: #facc15;

    margin-top: 5px;
}


/* =====================================================
   أزرار التحكم
===================================================== */

.controls {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-top: 10px;

    margin-bottom: 20px;
}

.control-button {

    border: none;

    border-radius: 15px;

    padding: 14px 10px;

    font-size: 17px;

    font-weight: bold;

    color: white;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid
        rgba(255,255,255,.15);

    cursor: pointer;
}

.control-button:active {

    transform: scale(.96);
}


/* =====================================================
   النتيجة
===================================================== */

.result {

    display: none;

    text-align: center;

    background:
        rgba(255,255,255,.08);

    border-radius: 25px;

    padding:
        30px 20px;

    margin-top: 20px;
}

.result h2 {

    font-size: 28px;

    margin-bottom: 20px;
}

.result-score {

    font-size: 52px;

    font-weight: bold;

    color: #facc15;

    margin-bottom: 15px;
}

.result-text {

    font-size: 21px;

    font-weight: bold;

    margin-bottom: 25px;

    line-height: 1.8;
}

.result-buttons {

    display: flex;

    flex-direction: column;

    gap: 12px;
}

.result-button {

    border: none;

    border-radius: 16px;

    padding: 15px;

    font-size: 18px;

    font-weight: bold;

    color: white;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    cursor: pointer;
}


/* =====================================================
   المفرقعات
===================================================== */

.confetti {

    position: fixed;

    top: -20px;

    width: 9px;

    height: 14px;

    z-index: 9999;

    pointer-events: none;

    animation:
        confettiFall
        1.4s
        linear
        forwards;
}

@keyframes confettiFall {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;
    }

    100% {

        transform:
            translateY(105vh)
            rotate(720deg);

        opacity: 0;
    }
}


/* =====================================================
   الجوال
===================================================== */

@media (max-width: 500px) {

    h1 {

        font-size: 25px;
    }

    .subtitle {

        font-size: 15px;
    }

    .question-title {

        font-size: 21px;
    }

    .flag {

        font-size: 68px;
    }

    .question-country {

        font-size: 28px;
    }

    .question-capital {

        font-size: 25px;
    }

    .answer {

        font-size: 16px;

        min-height: 70px;
    }

    .answer.flag-answer {

        font-size: 45px;
    }

}

</style>

/*
   رقم خاص للتحكم في الأصوات.

   إذا ضغط المستخدم القائمة أو إعادة
   نغيّر الرقم، وبالتالي أي صوت قديم
   لن يكمل تنفيذ أوامره.
*/

let speechSession = 0;


/* =====================================================
   خلط
===================================================== */

function shuffle(array) {

    const result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }

    return result;
}


/* =====================================================
   النطق العربي

   مهم:
   لا ننتقل للسؤال التالي حتى onend
   ينتهي الصوت فعليًا.
===================================================== */

function speakArabic(text) {

    return new Promise(resolve => {

        if (
            !("speechSynthesis" in window)
        ) {

            resolve();

            return;
        }


        const mySession =
            speechSession;


        speechSynthesis.cancel();


        const cleanText =
            String(text)
            .replace(
                /[🎉❌✅🌍🏳️🏛️🇸🇦🇪🇬🇦🇪🇰🇼🇶🇦🇧🇭🇴🇲🇾🇪🇮🇶🇯🇴🇸🇾🇱🇧🇵🇸🇲🇦🇩🇿🇹🇳🇱🇾🇸🇩🇸🇴🇹🇷🇮🇷🇵🇰🇮🇳🇨🇳🇯🇵🇰🇷🇮🇩🇲🇾🇹🇭🇷🇺🇺🇦🇩🇪🇫🇷🇮🇹🇪🇸🇵🇹🇬🇧🇳🇱🇧🇪🇨🇭🇦🇹🇬🇷🇸🇪🇳🇴🇩🇰🇫🇮🇮🇪🇵🇱🇷🇴🇨🇿🇭🇺🇦🇺🇳🇿🇨🇦🇺🇸🇲🇽🇧🇷🇦🇷🇨🇱🇨🇴🇵🇪🇿🇦🇳🇬🇪🇹🇰🇪🇬🇭🇹🇿🇺🇬🇿🇼🇿🇲🇸🇳🇨🇲]/g,
                ""
            )
            .trim();


        if (!cleanText) {

            resolve();

            return;
        }


        const utterance =
            new SpeechSynthesisUtterance(
                cleanText
            );


        utterance.lang =
            "ar-SA";


        /*
           سرعة النطق.
           0.88 أبطأ قليلًا حتى تكون
           الكلمات أوضح.
        */

        utterance.rate =
            0.88;


        utterance.pitch =
            1;


        utterance.volume =
            1;


        const voices =
            speechSynthesis.getVoices();


        let arabicVoice =
            voices.find(
                voice =>
                    voice.lang &&
                    voice.lang.toLowerCase()
                    === "ar-sa"
            );


        if (!arabicVoice) {

            arabicVoice =
                voices.find(
                    voice =>
                        voice.lang &&
                        voice.lang.toLowerCase()
                        === "ar"
                );

        }


        if (!arabicVoice) {

            arabicVoice =
                voices.find(
                    voice =>
                        voice.lang &&
                        voice.lang
                        .toLowerCase()
                        .startsWith("ar-")
                );

        }


        if (arabicVoice) {

            utterance.voice =
                arabicVoice;

        }


        let finished =
            false;


        function done() {

            if (finished)
                return;

            finished = true;

            if (
                mySession ===
                speechSession
            ) {

                resolve();

            }

        }


        utterance.onend =
            done;


        utterance.onerror =
            done;


        speechSynthesis.speak(
            utterance
        );

    });

}


/* =====================================================
   إلغاء الصوت
===================================================== */

function stopSpeech() {

    speechSession++;

    if (
        "speechSynthesis"
        in window
    ) {

        speechSynthesis.cancel();

    }

}

/* =====================================================
   تحديد النص الصوتي للإجابة
===================================================== */

function getCorrectSpeech(
    item,
    questionType
) {

    if (
        questionType ===
        "countryToCapital"
    ) {

        return item.speechCapital;

    }


    return item.speechCountry;

}


/* =====================================================
   إنشاء اختيارات
===================================================== */

function makeOptions(
    correctValue,
    type
) {

    let values = [];


    countries.forEach(item => {

        let value;


        if (type === "country") {

            value =
                item.country;

        }

        else if (type === "capital") {

            value =
                item.capital;

        }

        else {

            value =
                item.flag;

        }


        if (
            value !== correctValue &&
            !values.includes(value)
        ) {

            values.push(value);

        }

    });


    values =
        shuffle(values)
        .slice(0, 3);


    values.push(
        correctValue
    );


    return shuffle(values);

}


/* =====================================================
   إنشاء أسئلة لنوع معين
===================================================== */

function createQuestions(
    questionType
) {

    const selected =
        shuffle(countries)
        .slice(
            0,
            QUESTIONS_PER_MODE
        );


    return selected.map(
        item => {

            let options;


            if (
                questionType ===
                "flagToCountry"
            ) {

                options =
                    makeOptions(
                        item.country,
                        "country"
                    );

            }


            else if (
                questionType ===
                "countryToFlag"
            ) {

                /*
                   مهم جدًا:
                   الإجابة الصحيحة هي العلم
                   وليس اسم الدولة.
                */

                options =
                    makeOptions(
                        item.flag,
                        "flag"
                    );

            }


            else if (
                questionType ===
                "countryToCapital"
            ) {

                options =
                    makeOptions(
                        item.capital,
                        "capital"
                    );

            }


            else if (
                questionType ===
                "capitalToCountry"
            ) {

                options =
                    makeOptions(
                        item.country,
                        "country"
                    );

            }


            return {

                item: item,

                options: options,

                questionType:
                    questionType

            };

        }
    );

}


/* =====================================================
   بدء اللعبة
===================================================== */

function startMode(mode) {

    stopSpeech();

    lastMode =
        mode;

    currentMode =
        mode;

    currentQuestion =
        0;

    score =
        0;

    correctAnswers =
        0;

    wrongAnswers =
        0;

    answerLocked =
        false;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "none";


    document.getElementById(
        "game"
    ).style.display =
        "block";


    /*
       وضع الجميع:

       20 علم → دولة
       20 دولة → علم
       20 دولة → عاصمة
       20 عاصمة → دولة

       المجموع = 80
    */

    if (mode === "all") {

        questions = shuffle([

            ...createQuestions(
                "flagToCountry"
            ),

            ...createQuestions(
                "countryToFlag"
            ),

            ...createQuestions(
                "countryToCapital"
            ),

            ...createQuestions(
                "capitalToCountry"
            )

        ]);

    }

    else {

        questions =
            createQuestions(
                mode
            );

    }


    showQuestion();

}


/* =====================================================
   عرض السؤال
===================================================== */

function showQuestion() {

    stopSpeech();

    answerLocked =
        false;


    if (
        currentQuestion >=
        questions.length
    ) {

        showResult();

        return;
    }


    const question =
        questions[
            currentQuestion
        ];


    const item =
        question.item;


    const type =
        question.questionType;


    const questionNumber =
        document.getElementById(
            "questionNumber"
        );


    questionNumber.innerHTML =
        `السؤال <span>${currentQuestion + 1} / ${questions.length}</span>`;


    document.getElementById(
        "score"
    ).textContent =
        `النقاط: ${score}`;


    document.getElementById(
        "correction"
    ).innerHTML =
        "";


    const title =
        document.getElementById(
            "questionTitle"
        );


    const content =
        document.getElementById(
            "questionContent"
        );


    const answers =
        document.getElementById(
            "answers"
        );


    title.textContent =
        "";


    content.innerHTML =
        "";


    answers.innerHTML =
        "";


    /* =================================================
       العلم → الدولة
    ================================================= */

    if (
        type ===
        "flagToCountry"
    ) {

        title.textContent =
            "ما اسم هذه الدولة؟";


        content.innerHTML =
            `<div class="flag">
                ${item.flag}
             </div>`;

    }


    /* =================================================
       الدولة → العلم
    ================================================= */

    else if (
        type ===
        "countryToFlag"
    ) {

        title.textContent =
            `ما علم ${item.country}؟`;


        content.innerHTML =
            `<div class="question-country">
                ${item.country}
             </div>`;

    }


    /* =================================================
       الدولة → العاصمة
    ================================================= */

    else if (
        type ===
        "countryToCapital"
    ) {

        title.textContent =
            `ما عاصمة ${item.country}؟`;


        content.innerHTML =
            `<div class="question-country">
                ${item.country}
             </div>`;

    }


    /* =================================================
       العاصمة → الدولة
    ================================================= */

    else if (
        type ===
        "capitalToCountry"
    ) {

        title.textContent =
            "هذه عاصمة أي دولة؟";


        content.innerHTML =
            `<div class="question-capital">
                ${item.capital}
             </div>`;

    }


    /* =================================================
       إنشاء الأزرار
    ================================================= */

    question.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            /*
               الدولة → العلم
               يجعل العلم كبيرًا.
            */

            if (
                type ===
                "countryToFlag"
            ) {

                button.classList.add(
                    "flag-answer"
                );

            }


            button.textContent =
                option;


            button.onclick =
                function() {

                    chooseAnswer(
                        option
                    );

                };


            answers.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   اختيار الإجابة
===================================================== */

async function chooseAnswer(
    selected
) {

    if (answerLocked)
        return;


    answerLocked =
        true;


    stopSpeech();


    const question =
        questions[
            currentQuestion
        ];


    const item =
        question.item;


    const type =
        question.questionType;


    let correctValue;


    if (
        type ===
        "flagToCountry"
    ) {

        correctValue =
            item.country;

    }


    else if (
        type ===
        "countryToFlag"
    ) {

        correctValue =
            item.flag;

    }


    else if (
        type ===
        "countryToCapital"
    ) {

        correctValue =
            item.capital;

    }


    else {

        correctValue =
            item.country;

    }


    const isCorrect =
        selected ===
        correctValue;


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(
        button => {

            button.classList.add(
                "disabled"
            );


            if (
                button.textContent ===
                correctValue
            ) {

                button.classList.add(
                    "correct"
                );

            }


            if (
                button.textContent ===
                selected &&
                !isCorrect
            ) {

                button.classList.add(
                    "wrong"
                );

            }

        }
    );


    const correction =
        document.getElementById(
            "correction"
        );


    /* =================================================
       إجابة صحيحة
    ================================================= */

    if (isCorrect) {

        score++;

        correctAnswers++;


        correction.innerHTML =
            `<div class="correct-message">
                أحسنت! الإجابة صحيحة 🎉
             </div>`;


        /*
           المفرقعات
        */

        createConfetti();


        /*
           ننتظر حتى ينتهي الصوت كاملًا.
        */

        await speakSuccess();


        /*
           إذا لم يلغِ المستخدم اللعبة
        */

        if (
            currentQuestion <
            questions.length
        ) {

            currentQuestion++;

            showQuestion();

        }


    }


    /* =================================================
       إجابة خاطئة
    ================================================= */

    else {

        wrongAnswers++;


        correction.innerHTML =
            `<div class="wrong-message">
                خطأ ❌
             </div>`;


        /*
           أولًا ينطق "خطأ"
           وينتظر حتى ينتهي الصوت.
        */

        await speakError();


        /*
           إذا ألغى المستخدم اللعبة
           نتوقف.
        */

        if (
            currentQuestion >=
            questions.length
        ) {

            return;

        }


        /*
           انتظار ثانيتين كاملتين.
        */

        await wait(2000);


        /*
           إذا ضغط المستخدم القائمة
           أثناء الانتظار.
        */

        if (
            answerLocked === false
        ) {

            return;

        }


        const correctSpeech =
            getCorrectSpeech(
                item,
                type
            );


        /*
           عرض الإجابة الصحيحة.
        */

        let displayedAnswer;


        if (
            type ===
            "countryToFlag"
        ) {

            displayedAnswer =
                `${item.country} ${item.flag}`;

        }

        else if (
            type ===
            "flagToCountry"
        ) {

            displayedAnswer =
                item.country;

        }

        else if (
            type ===
            "countryToCapital"
        ) {

            displayedAnswer =
                item.capital;

        }

        else {

            displayedAnswer =
                item.country;

        }


        correction.innerHTML =
            `<div class="wrong-message">
                خطأ ❌
             </div>

             <div class="correct-answer">
                الإجابة الصحيحة:
                ${displayedAnswer}
             </div>`;


        /*
           نطق الإجابة الصحيحة كاملة.
        */

        await speakArabic(
            correctSpeech
        );


        /*
           الآن فقط ننتقل للسؤال التالي.
        */

        if (
            answerLocked
        ) {

            currentQuestion++;

            showQuestion();

        }

    }

}


/* =====================================================
   الانتظار
===================================================== */

function wait(ms) {

    return new Promise(
        resolve => {

            setTimeout(
                resolve,
                ms
            );

        }
    );

}


/* =====================================================
   المفرقعات 🎉
===================================================== */

function createConfetti() {

    const pieces =
        45;


    const symbols = [
        "🎉",
        "🎊",
        "✨",
        "⭐",
        "🌟"
    ];


    for (
        let i = 0;
        i < pieces;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        /*
           بعض القطع Emoji
           وبعضها مستطيلات خفيفة.
        */

        if (
            Math.random() < 0.35
        ) {

            piece.textContent =
                symbols[
                    Math.floor(
                        Math.random()
                        * symbols.length
                    )
                ];

            piece.style.width =
                "auto";

            piece.style.height =
                "auto";

            piece.style.fontSize =
                "18px";

        }


        else {

            const colors = [

                "#ef4444",
                "#22c55e",
                "#3b82f6",
                "#facc15",
                "#ec4899",
                "#a855f7"

            ];


            piece.style.background =
                colors[
                    Math.floor(
                        Math.random()
                        * colors.length
                    )
                ];

        }


        piece.style.left =
            Math.random() * 100
            + "%";


        piece.style.animationDuration =
            (
                1.1 +
                Math.random() * .8
            )
            + "s";


        piece.style.animationDelay =
            (
                Math.random() * .2
            )
            + "s";


        document.body.appendChild(
            piece
        );


        setTimeout(
            () => {

                piece.remove();

            },

            2200

        );

    }

}

function showResult() {

    stopSpeech();


    document.getElementById(
        "game"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "block";


    const total =
        questions.length;


    const percentage =
        Math.round(
            (score / total) * 100
        );


    document.getElementById(
        "resultScore"
    ).textContent =
        `${percentage}%`;


    let resultText;


    if (percentage >= 90) {

        resultText =
            `ممتاز جدًا! 🎉
             <br>
             ${score} من ${total}`;

    }

    else if (percentage >= 80) {

        resultText =
            `ممتاز 👏
             <br>
             ${score} من ${total}`;

    }

    else if (percentage >= 70) {

        resultText =
            `جيد جدًا 👍
             <br>
             ${score} من ${total}`;

    }

    else if (percentage >= 60) {

        resultText =
            `جيد 🙂
             <br>
             ${score} من ${total}`;

    }

    else {

        resultText =
            `حاول مرة أخرى 💪
             <br>
             ${score} من ${total}`;

    }


    document.getElementById(
        "resultText"
    ).innerHTML =
        resultText;

}

function restartGame() {

    const confirmed =
        confirm(
            "ستُصفّر الإحصائيات الحالية.\n\nهل تريد إعادة اللعبة؟"
        );


    if (!confirmed)
        return;


    stopSpeech();


    startMode(
        lastMode
    );

}


/* =====================================================
   تحميل الأصوات
===================================================== */

if (
    "speechSynthesis"
    in window
) {

    speechSynthesis
        .getVoices();


    speechSynthesis
        .onvoiceschanged =
        function() {

            speechSynthesis
                .getVoices();

        };

}
