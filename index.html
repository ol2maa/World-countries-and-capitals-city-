<title>الدول والعواصم والأعلام</title>

<style>

    box-sizing:border-box;
    margin:0;
    padding:0

#app{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:18px 14px 30px
}

h1{
    text-align:center;
    font-size:26px;
    margin:8px 0 20px
}

.screen{
    display:none
}

.screen.active{
    display:block
}

.menu-card{
    width:100%;
    border:0;
    border-radius:18px;
    padding:20px 16px;
    margin:12px 0;
    background:white;
    box-shadow:0 4px 14px rgba(0,0,0,.10);
    font-size:20px;
    font-weight:800;
    cursor:pointer
}

.menu-card:active{
    transform:scale(.98)
}

.top{
    background:white;
    border-radius:18px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    text-align:center
}

.mode{
    font-size:18px;
    font-weight:800;
    margin-bottom:7px
}

.progress{
    font-size:17px;
    margin-bottom:5px
}

.stats{
    font-size:16px
}

.correctCount{
    color:#16833b;
    font-weight:800
}

.wrongCount{
    color:#d21f2f;
    font-weight:800
}

.question{
    background:white;
    border-radius:20px;
    padding:20px 14px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
    margin-bottom:12px
}

.questionText{
    font-size:24px;
    font-weight:800;
    margin-bottom:16px
}

.questionFlag{
    font-size:72px;
    line-height:1.2;
    margin:8px 0 15px
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px
}

.option{
    min-height:70px;
    border:2px solid #ddd;
    background:#fff;
    border-radius:16px;
    padding:10px 7px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center
}

.option.flag{
    font-size:52px
}

.option.correct{
    background:#b9f6c5!important;
    border-color:#159447!important;
    color:#075b28
}

.option.wrong{
    background:#ffc1c7!important;
    border-color:#d51f32!important;
    color:#8d101d
}

.option:disabled{
    cursor:default
}

/* رسالة النتيجة بعد الإجابة */

.correction{
    margin-top:14px;
    padding:13px;
    border-radius:14px;
    background:#f0f2f5;
    font-size:17px;
    font-weight:700;
    line-height:1.7;
    min-height:50px
}

.correction.hidden{
    display:none

.speakHint{

    color:#666;
    margin-top:7px

.next{
    width:100%;
    border:0;
    border-radius:15px;

    margin-top:12px;
    background:#111;
    color:white;
    font-size:18px;
    font-weight:800;
    cursor:pointer

.next:disabled{

/* أزرار القائمة والإعادة */

.quizActions{

.quizAction{

    background:white;
    color:#111;
    font-size:16px;
    font-weight:800;

.quizAction:active{

.result p{

.resultBtns{

.resultBtns button{

    border-radius:14px;
    padding:14px;
    font-size:17px;
    font-weight:800

.modal{

    inset:0;
    background:rgba(0,0,0,.45);

.modal.show{

.cancelBtn{

    color:#111

     القائمة الرئيسية
========================= -->

</div>

</section>

========================= -->

<section id="result" class="screen">

<p>

</button>

<button onclick="repeatMode()">
🔄 إعادة
</button>

</div>

</div>

</section>

</div>

========================= -->

class="modal">

<button class="confirmBtn"

</div>

</div>

</div>

/* =====================================================
   أنماط اللعبة
===================================================== */

const MODES={

flagToCountry:{
    name:"🏳️ علم و دول"
},

countryToFlag:{
    name:"🌍 دوله واعلام"
},

countryToCapital:{
    name:"🏙️ دوله وعواصم"
},

capitalToCountry:{
    name:"🏛️ عاصمة و دول"
}

};


/* =====================================================
   المتغيرات
===================================================== */

let currentMode=null;

let modeQueue=[];

let modeIndex=0;

let questions=[];

let qIndex=0;

let correct=0;

let wrong=0;

let answered=false;

let lastModeForRepeat=null;

let allStats=[];

let warningAction=null;


/* =====================================================
   خلط
===================================================== */

function shuffle(arr){

    const a=[...arr];

    for(let i=a.length-1;i>0;i--){

        const j=Math.floor(
            Math.random()*(i+1)
        );

        [a[i],a[j]]=[
            a[j],a[i]
        ];

    }

    return a;
}


/* =====================================================
   اختيار 20 دولة
===================================================== */

function sampleCountries(n=20){

    return shuffle(countries).slice(0,n);

}


/* =====================================================
   إظهار الشاشة
===================================================== */

function show(id){

    document
    .querySelectorAll(".screen")
    .forEach(x=>{
        x.classList.remove("active");
    });

    document
    .getElementById(id)
    .classList.add("active");

}


/* =====================================================
   بدء اللعبة
===================================================== */

function startMode(mode){

    speechSynthesis.cancel();

    lastModeForRepeat=mode;

    allStats=[];

    modeQueue=
        mode==="all"
        ?
        [
            "flagToCountry",
            "countryToFlag",
            "countryToCapital",
            "capitalToCountry"
        ]
        :
        [mode];

    modeIndex=0;

    beginCard(
        modeQueue[modeIndex]
    );

}


/* =====================================================
   بدء المرحلة
===================================================== */

function beginCard(mode){

    currentMode=mode;

    questions=
        sampleCountries(20);

    qIndex=0;

    correct=0;

    wrong=0;

    document
    .getElementById("modeName")
    .textContent=
        MODES[mode].name;

    show("quiz");

    renderQuestion();

}


/* =====================================================
   رقم السؤال
===================================================== */

function getProgressText(){

    if(lastModeForRepeat==="all"){

        const totalNumber=
            modeIndex*20+
            qIndex+
            1;

        return `السؤال ${totalNumber} / 80`;

    }

    return `السؤال ${qIndex+1} / 20`;

}


/* =====================================================
   عرض السؤال
===================================================== */

function renderQuestion(){

    answered=false;

    speechSynthesis.cancel();

    document
    .getElementById("progress")
    .textContent=
        getProgressText();

    document
    .getElementById("correct")
    .textContent=
        correct;

    document
    .getElementById("wrong")
    .textContent=
        wrong;


    const correction=
        document.getElementById(
            "correction"
        );

    correction.textContent="";

    correction.classList.add(
        "hidden"
    );


    document
    .getElementById("nextBtn")
    .disabled=true;


    const item=
        questions[qIndex];

    const qt=
        document.getElementById(
            "questionText"
        );

    const qf=
        document.getElementById(
            "questionFlag"
        );

    const opts=
        document.getElementById(
            "options"
        );


    qt.textContent="";

    qf.textContent="";

    opts.innerHTML="";


    if(currentMode==="flagToCountry"){

        qt.textContent=
            "هذا علم أي دولة؟";

        qf.textContent=
            item.flag;

        buildOptions(
            item,
            "country"
        );

    }

    else if(
        currentMode==="countryToFlag"
    ){

        qt.textContent=
            item.country;

        buildOptions(
            item,
            "flag"
        );

    }

    else if(
        currentMode==="countryToCapital"
    ){

        qt.textContent=
            item.country;

        buildOptions(
            item,
            "capital"
        );

    }

    else{

        qt.textContent=
            item.capital;

        buildOptions(
            item,
            "country"
        );

    }

}


/* =====================================================
   الخيارات
===================================================== */

function buildOptions(
    correctItem,
    type
){

    const pool=
        shuffle(
            countries.filter(
                c=>
                    c.country !==
                    correctItem.country
            )
        ).slice(0,3);


    shuffle(
        [
            correctItem,
            ...pool
        ]
    ).forEach(item=>{

        const b=
            document.createElement(
                "button"
            );


        b.className=
            "option"+
            (
                type==="flag"
                ?
                " flag"
                :
                ""
            );


        b.textContent=
            type==="flag"
            ?
            item.flag
            :
            type==="capital"
            ?
            item.capital
            :
            item.country;


        b.dataset.country=
            item.country;


        b.onclick=()=>{
            chooseAnswer(
                b,
                item
            );
        };


        document
        .getElementById(
            "options"
        )
        .appendChild(b);

    });

}

/* =====================================================
   اختيار النص الصحيح للنطق
===================================================== */

function speechText(text){

    return speechFixes[text] || text;

}


/* =====================================================
   اختيار صوت العربية السعودية
===================================================== */

function getArabicVoice(){

    const voices=
        speechSynthesis.getVoices();


    /*
       الأفضل:
       العربية السعودية
    */

    let voice=
        voices.find(
            v=>v.lang &&
            v.lang.toLowerCase()==="ar-sa"
        );


    /*
       محاولة ثانية بالاسم
    */

    if(!voice){

        voice=
            voices.find(
                v=>
                    v.lang &&
                    v.lang
                    .toLowerCase()
                    .startsWith("ar-sa")
            );

    }


    /*
       أي صوت عربي كحل احتياطي
    */

    if(!voice){

        voice=
            voices.find(
                v=>
                    v.lang &&
                    v.lang
                    .toLowerCase()
                    .startsWith("ar")
            );

    }


    return voice || null;

}


/* =====================================================
   النطق العربي
===================================================== */

function speakArabic(text){

    if(!("speechSynthesis" in window))
        return;


    speechSynthesis.cancel();


    const u=
        new SpeechSynthesisUtterance(
            speechText(text)
        );


    /*
       العربية السعودية
    */

    u.lang="ar-SA";


    /*
       السرعة
       0.9 مناسبة للتعلم
    */

    u.rate=0.9;

    u.pitch=1;

    u.volume=1;


    const voice=
        getArabicVoice();


    if(voice){

        u.voice=voice;

    }


    speechSynthesis.speak(u);

}


/* =====================================================
   اختيار الإجابة
===================================================== */

function chooseAnswer(button,item){

    if(answered)
        return;


    answered=true;

    speechSynthesis.cancel();


    const correctItem=
        questions[qIndex];


    const isCorrect=
        item.country===
        correctItem.country;


    /*
       تعطيل جميع الأزرار
    */

    document
    .querySelectorAll(".option")
    .forEach(b=>{

        b.disabled=true;


        if(
            b.dataset.country===
            correctItem.country
        ){

            b.classList.add(
                "correct"
            );

        }

    });


    /* ==============================================
       الإجابة الصحيحة
    ============================================== */

    if(isCorrect){

        correct++;

        button.classList.add(
            "correct"
        );


        document
        .getElementById("correct")
        .textContent=
            correct;


        /*
           رسالة نجاح
        */

        const correction=
            document.getElementById(
                "correction"
            );


        correction.classList.remove(
            "hidden"
        );


        correction.innerHTML=
            "أحسنت! الإجابة صحيحة 🎉";


        /*
           لا ننطق الكلمة مرة ثانية
           حتى لا يحدث التكرار المزعج
        */


        document
        .getElementById("nextBtn")
        .disabled=false;


        return;

    }


    /* ==============================================
       الإجابة الخاطئة
    ============================================== */

    wrong++;

    button.classList.add(
        "wrong"
    );


    document
    .getElementById("wrong")
    .textContent=
        wrong;


    const correction=
        document.getElementById(
            "correction"
        );


    correction.classList.remove(
        "hidden"
    );


    let correctionText="";


    if(
        currentMode===
        "flagToCountry"
    ){

        correctionText=
            `❌ خطأ<br>
             الإجابة الصحيحة:
             ${correctItem.flag}
             ${correctItem.country}<br>
             العاصمة:
             ${correctItem.capital}`;

    }

    else if(
        currentMode===
        "countryToFlag"
    ){

        correctionText=
            `❌ خطأ<br>
             الإجابة الصحيحة:
             ${correctItem.country}
             ${correctItem.flag}<br>
             العاصمة:
             ${correctItem.capital}`;

    }

    else if(
        currentMode===
        "countryToCapital"
    ){

        correctionText=
            `❌ خطأ<br>
             الإجابة الصحيحة:
             ${correctItem.capital}`;

    }

    else{

        correctionText=
            `❌ خطأ<br>
             الإجابة الصحيحة:
             ${correctItem.country}
             ${correctItem.flag}`;

    }


    correction.innerHTML=
        correctionText;


    /*
       أول صوت:
       خَطَأ
    */

    speakArabic("خطأ");


    /*
       منع التالي
    */

    document
    .getElementById("nextBtn")
    .disabled=true;


    /*
       انتظار ثانيتين
    */

    setTimeout(()=>{

        const answerText=
            currentMode===
            "countryToCapital"
            ?
            correctItem.capital
            :
            correctItem.country;


        /*
           نطق الإجابة الصحيحة مرة واحدة
        */

        speakArabic(
            answerText
        );


        /*
           السماح بالانتقال
        */

        setTimeout(()=>{

            document
            .getElementById("nextBtn")
            .disabled=false;

        },900);


    },2000);

}


/* =====================================================
   السؤال التالي
===================================================== */

function nextQuestion(){

    if(!answered)
        return;


    qIndex++;


    if(qIndex<20){

        renderQuestion();

    }

    else{

        finishCard();

    }

}


/* =====================================================
   نهاية المرحلة
===================================================== */

function finishCard(){

    allStats.push({

        mode:currentMode,

        correct:correct,

        wrong:wrong

    });


    if(
        modeIndex<
        modeQueue.length-1
    ){

        modeIndex++;

        beginCard(
            modeQueue[modeIndex]
        );

    }

    else{

        finishGame();

    }

}


/* =====================================================
   نهاية اللعبة
===================================================== */

function finishGame(){

    speechSynthesis.cancel();


    const totalCorrect=
        allStats.reduce(
            (s,x)=>
                s+x.correct,
            0
        );


    const totalWrong=
        allStats.reduce(
            (s,x)=>
                s+x.wrong,
            0
        );


    const total=
        totalCorrect+
        totalWrong;


    const percent=
        total
        ?
        Math.round(
            totalCorrect/
            total*
            100
        )
        :
        0;


    let rating=
        percent>=90
        ?
        "🌟 ممتاز"
        :
        percent>=80
        ?
        "👏 جيد جدًا"
        :
        percent>=70
        ?
        "👍 جيد"
        :
        percent>=60
        ?
        "🙂 مقبول"
        :
        "💪 يحتاج تدريب";


    document
    .getElementById(
        "resultTitle"
    )
    .textContent=
        lastModeForRepeat===
        "all"
        ?
        "🎉 انتهت لعبة الجميع"
        :
        "🎉 انتهت اللعبة";


    document
    .getElementById(
        "resultCorrect"
    )
    .textContent=
        totalCorrect;


    document
    .getElementById(
        "resultWrong"
    )
    .textContent=
        totalWrong;


    document
    .getElementById(
        "resultPercent"
    )
    .textContent=
        percent+"%";


    document
    .getElementById(
        "resultRating"
    )
    .textContent=
        rating;


    show("result");

}


/* =====================================================
   طلب العودة للقائمة
===================================================== */

function requestMenu(){

    warningAction="menu";

    document
    .getElementById(
        "warningModal"
    )
    .classList.add(
        "show"
    );

}


/* =====================================================
   طلب إعادة اللعبة
===================================================== */

function requestRepeat(){

    warningAction="repeat";

    document
    .getElementById(
        "warningModal"
    )
    .classList.add(
        "show"
    );

}


/* =====================================================
   موافق على التنبيه
===================================================== */

function confirmWarning(){

    const action=
        warningAction;


    warningAction=null;


    document
    .getElementById(
        "warningModal"
    )
    .classList.remove(
        "show"
    );


    speechSynthesis.cancel();


    /*
       تصفير الإحصائيات
    */

    correct=0;

    wrong=0;

    allStats=[];


    if(action==="menu"){

        show("menu");

    }

    else if(action==="repeat"){

        startMode(
            lastModeForRepeat
        );

    }

}


/* =====================================================
   إلغاء التنبيه
===================================================== */

function cancelWarning(){

    warningAction=null;

    document
    .getElementById(
        "warningModal"
    )
    .classList.remove(
        "show"
    );

}


/* =====================================================
   العودة من النتيجة للقائمة
===================================================== */

function backToMenu(){

    speechSynthesis.cancel();

    show("menu");

}


/* =====================================================
   إعادة اللعبة من شاشة النتيجة
===================================================== */

function repeatMode(){

    speechSynthesis.cancel();

    startMode(
        lastModeForRepeat
    );

}

   تحميل الأصوات
===================================================== */

if(
    "speechSynthesis"
    in window
){

    speechSynthesis.onvoiceschanged=
        ()=>{};

}
