<title>مسابقة الدول والعواصم</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b
        );

    min-height: 100vh;
    color: white;
    padding: 15px;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 28px;
    margin: 10px 0 20px;
}

.subtitle {
    text-align: center;
    color: #cbd5e1;
    margin-bottom: 20px;
    font-size: 15px;
}

/* =========================
   القائمة
========================= */

.menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.mode-button {
    width: 100%;
    border: none;
    border-radius: 18px;
    padding: 18px 15px;

    font-size: 18px;
    font-weight: bold;

    color: white;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    box-shadow:
        0 6px 15px rgba(0,0,0,.25);

    cursor: pointer;

    transition:
        transform .15s,
        opacity .15s;
}

.mode-button:active {
    transform: scale(.97);
    opacity: .85;
}

/* =========================
   اللعبة
========================= */

.game {
    display: none;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;

    background: rgba(255,255,255,.08);

    border-radius: 15px;

    padding: 12px 15px;

    margin-bottom: 15px;
}

.question-number {
    font-size: 16px;
    font-weight: bold;
}

.score {
    font-size: 16px;
    font-weight: bold;
}

.question-box {

    background:
        rgba(255,255,255,.08);

    border-radius: 22px;

    padding: 25px 15px;

    text-align: center;

    margin-bottom: 15px;

    min-height: 180px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    box-shadow:
        0 8px 25px rgba(0,0,0,.20);
}

.question-title {
    font-size: 23px;
    font-weight: bold;

    margin-bottom: 18px;

    line-height: 1.5;
}

.flag {
    font-size: 75px;
    line-height: 1.2;

    margin: 5px 0 10px;
}

.capital {
    font-size: 27px;
    font-weight: bold;

    color: #facc15;
}

.answers {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

    margin-top: 15px;
}

.answer {

    border: none;

    border-radius: 18px;

    min-height: 70px;

    padding: 12px;

    font-size: 18px;

    font-weight: bold;

    color: #0f172a;

    background: white;

    cursor: pointer;

    transition:
        transform .15s,
        background .2s,
        color .2s;
}

.answer:active {
    transform: scale(.96);
}

.answer.correct {

    background: #22c55e;

    color: white;
}

.answer.wrong {

    background: #ef4444;

    color: white;
}

.answer.disabled {
    pointer-events: none;
}

/* =========================
   التصحيح
========================= */

.correction {

    min-height: 55px;

    text-align: center;

    margin-top: 15px;

    font-size: 18px;

    font-weight: bold;

    line-height: 1.7;
}

.correct-message {
    color: #4ade80;
}

.wrong-message {
    color: #f87171;
}

.correct-answer {
    color: #facc15;
}

/* =========================
   أزرار التحكم
========================= */

.controls {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-top: 10px;

    margin-bottom: 20px;
}

.control-button {

    border: none;

    border-radius: 15px;

    padding: 14px 10px;

    font-size: 16px;

    font-weight: bold;

    color: white;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid rgba(255,255,255,.15);

    cursor: pointer;

    transition:
        transform .15s;
}

.control-button:active {
    transform: scale(.96);
}

/* =========================
   صفحة النتيجة
========================= */

.result {

    display: none;

    text-align: center;

    background:
        rgba(255,255,255,.08);

    border-radius: 25px;

    padding: 30px 20px;

    margin-top: 20px;
}

.result h2 {
    font-size: 28px;
    margin-bottom: 20px;
}

.result-score {

    font-size: 50px;

    font-weight: bold;

    color: #facc15;

    margin-bottom: 15px;
}

.result-text {

    font-size: 21px;

    font-weight: bold;

    margin-bottom: 25px;
}

.result-buttons {

    display: flex;

    flex-direction: column;

    gap: 12px;
}

.result-button {

    border: none;

    border-radius: 16px;

    padding: 15px;

    font-size: 18px;

    font-weight: bold;

    color: white;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    cursor: pointer;
}

/* =========================
   الجوال
========================= */

@media (max-width: 500px) {

    h1 {
        font-size: 24px;
    }

    .question-title {
        font-size: 20px;
    }

    .flag {
        font-size: 65px;
    }

    .capital {
        font-size: 24px;
    }

    .answer {
        font-size: 16px;
        min-height: 65px;
    }

}

</style>
</head>

/* =====================================================

===================================================== */

const uniqueCountries = [];

const seenCountries = new Set();

countries.forEach(item => {

    if(!seenCountries.has(item.country)){

        seenCountries.add(item.country);

        uniqueCountries.push(item);

/* =====================================================

===================================================== */

let currentMode = "";

let lastMode = "";

let questions = [];

let score = 0;

let correctAnswers = 0;

let wrongAnswers = 0;

/* =====================================================
   إعدادات اللعبة
===================================================== */

const QUESTIONS_PER_MODE = 20;


/* =====================================================
   النطق العربي
===================================================== */

function speakArabic(text){

    if(!("speechSynthesis" in window)) return;

    clearTimeout(speechTimer);

    speechSynthesis.cancel();

    const cleanText =
        String(text)
        .replace(/[🎉❌✅🌍🏳️🏛️]/g,"")
        .trim();

    if(!cleanText) return;

    const u =
        new SpeechSynthesisUtterance(cleanText);

    /*
       نستخدم العربية السعودية كلغة للنطق.
       هذا لا يعني أن الجهاز يملك بالضرورة
       صوتًا سعوديًا؛ يعتمد على الأصوات الموجودة
       في الجهاز.
    */

    u.lang = "ar-SA";

    u.rate = 0.88;

    u.pitch = 1;

    u.volume = 1;

    const voices =
        speechSynthesis.getVoices();

    let arabicVoice =
        voices.find(v =>
            v.lang &&
            v.lang.toLowerCase() === "ar-sa"
        );

    if(!arabicVoice){

        arabicVoice =
            voices.find(v =>
                v.lang &&
                v.lang.toLowerCase() === "ar"
            );

    }

    if(!arabicVoice){

        arabicVoice =
            voices.find(v =>
                v.lang &&
                v.lang.toLowerCase().startsWith("ar-")
            );

    }

    if(arabicVoice){

        u.voice = arabicVoice;

    }

    speechSynthesis.speak(u);
}

/* =====================================================
   خلط المصفوفة
===================================================== */

function shuffle(array){

    const arr = [...array];

    for(let i = arr.length - 1; i > 0; i--){

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }

    return arr;
}


/* =====================================================
   إنشاء أسئلة وضع معين
===================================================== */

function createQuestions(mode){

    let pool =
        shuffle(uniqueCountries);

    /*
       نأخذ 20 سؤالًا فقط.
    */

    const selected =
        pool.slice(
            0,
            Math.min(
                QUESTIONS_PER_MODE,
                pool.length
            )
        );

    return selected.map(item => {

        let options;

        if(
            mode === "flagToCountry" ||
            mode === "capitalToCountry"
        ){

            options =
                makeOptions(
                    item.country,
                    "country"
                );

        }

        else if(
            mode === "countryToFlag"
        ){

            options =
                makeOptions(
                    item.country,
                    "flag"
                );

        }

        else if(
            mode === "countryToCapital"
        ){

            options =
                makeOptions(
                    item.capital,
                    "capital"
                );

        }

        return {
            item,
            options
        };

    });

}


/* =====================================================
   إنشاء الاختيارات
===================================================== */

function makeOptions(correctValue, type){

    let values = [];

    uniqueCountries.forEach(item => {

        let value;

        if(type === "country")
            value = item.country;

        else if(type === "capital")
            value = item.capital;

        else
            value = item.flag;

        if(
            value !== correctValue &&
            !values.includes(value)
        ){

            values.push(value);

        }

    });

    values =
        shuffle(values)
        .slice(0,3);

    values.push(correctValue);

    return shuffle(values);

}


/* =====================================================
   بدء الوضع
===================================================== */

function startMode(mode){

    clearTimeout(speechTimer);

    speechSynthesis.cancel();

    lastMode = mode;

    currentMode = mode;

    currentQuestion = 0;

    score = 0;

    correctAnswers = 0;

    wrongAnswers = 0;

    answerLocked = false;

    document.getElementById("menu").style.display =
        "none";

    document.getElementById("result").style.display =
        "none";

    document.getElementById("game").style.display =
        "block";

    if(mode === "all"){

        const q1 =
            createQuestions("flagToCountry");

        const q2 =
            createQuestions("countryToFlag");

        const q3 =
            createQuestions("countryToCapital");

        const q4 =
            createQuestions("capitalToCountry");

        questions =
            shuffle([
                ...q1,
                ...q2,
                ...q3,
                ...q4
            ]);

    }

    else{

        questions =
            createQuestions(mode);

    }

    showQuestion();

}


/* =====================================================
   عرض السؤال
===================================================== */

function showQuestion(){

    clearTimeout(speechTimer);

    speechSynthesis.cancel();

    answerLocked = false;

    document.getElementById("correction").innerHTML =
        "";

    if(currentQuestion >= questions.length){

        showResult();

        return;

    }

    const q =
        questions[currentQuestion];

    const item =
        q.item;

    const title =
        document.getElementById("questionTitle");

    const content =
        document.getElementById("questionContent");

    document.getElementById("questionNumber").textContent =
        `السؤال ${currentQuestion + 1} / ${questions.length}`;

    document.getElementById("score").textContent =
        `النقاط: ${score}`;

    title.textContent = "";

    content.innerHTML = "";


    /* =============================
       علم → دولة
    ============================= */

    if(
        currentMode === "flagToCountry" ||
        (
            currentMode === "all" &&
            q.options.includes(item.country)
        )
    ){

        /*
           تحديد نوع السؤال في وضع الجميع
        */

        if(
            questions[currentQuestion].mode
        ){

            // لا شيء
        }

    }


    /*
       تحديد النوع الحقيقي للسؤال
       لأن وضع الجميع يحتوي على أنواع مختلفة.
    */

    let questionType =
        detectQuestionType(q);


    if(questionType === "flagToCountry"){

        title.textContent =
            "ما اسم هذه الدولة؟";

        content.innerHTML =
            `<div class="flag">${item.flag}</div>`;

    }

    else if(questionType === "countryToFlag"){

        title.textContent =
            `ما علم ${item.country}؟`;

        content.innerHTML =
            `<div class="capital">
                ${item.country}
             </div>`;

    }

    else if(questionType === "countryToCapital"){

        title.textContent =
            `ما عاصمة ${item.country}؟`;

        content.innerHTML =
            `<div class="capital">
                ${item.country}
             </div>`;

    }

    else if(questionType === "capitalToCountry"){

        title.textContent =
            `هذه عاصمة أي دولة؟`;

        content.innerHTML =
            `<div class="capital">
                ${item.capital}
             </div>`;

    }


    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";


    q.options.forEach(option => {

        const button =
            document.createElement("button");

        button.className =
            "answer";

        /*
           إذا كان السؤال علم → دولة
           أو عاصمة → دولة
        */

        if(
            questionType === "flagToCountry" ||
            questionType === "capitalToCountry"
        ){

            button.textContent =
                option;

        }

        else if(questionType === "countryToFlag"){

            button.textContent =
                option;

            button.style.fontSize =
                "42px";

        }

        else{

            button.textContent =
                option;

        }


        button.onclick =
            () =>
            chooseAnswer(
                option,
                questionType
            );

        answers.appendChild(button);

    });

}


/* =====================================================
   تحديد نوع السؤال
===================================================== */

function detectQuestionType(q){

    /*
       في وضع "الجميع"
       نخزن النوع داخل السؤال.

       في الوضع العادي نستخدم currentMode.
    */

    if(q.questionType){

        return q.questionType;

    }

    return currentMode;

}


/* =====================================================
   إصلاح وضع الجميع
===================================================== */

function prepareAllQuestions(){

    const q1 =
        createQuestionsWithType(
            "flagToCountry"
        );

    const q2 =
        createQuestionsWithType(
            "countryToFlag"
        );

    const q3 =
        createQuestionsWithType(
            "countryToCapital"
        );

    const q4 =
        createQuestionsWithType(
            "capitalToCountry"
        );

    return shuffle([
        ...q1,
        ...q2,
        ...q3,
        ...q4
    ]);

}


function createQuestionsWithType(mode){

    const result =
        createQuestions(mode);

    result.forEach(q => {

        q.questionType = mode;

    });

    return result;

}


/* =====================================================
   إعادة تعريف startMode
   حتى يكون وضع الجميع مضبوطًا 80 سؤالًا
===================================================== */

function startGame(mode){

    clearTimeout(speechTimer);

    speechSynthesis.cancel();

    lastMode = mode;

    currentMode = mode;

    currentQuestion = 0;

    score = 0;

    correctAnswers = 0;

    wrongAnswers = 0;

    document.getElementById("menu").style.display =
        "none";

    document.getElementById("result").style.display =
        "none";

    document.getElementById("game").style.display =
        "block";


    if(mode === "all"){

        questions =
            prepareAllQuestions();

    }

    else{

        questions =
            createQuestionsWithType(mode);

    }

    showQuestion();

}

   نربط الزرار بالدالة الجديدة.
*/

/* =====================================================
   اختيار الإجابة
===================================================== */

function chooseAnswer(
    selected,
    questionType
){

    if(answerLocked) return;

    answerLocked = true;

    clearTimeout(speechTimer);

    speechSynthesis.cancel();

    const q =
        questions[currentQuestion];

    const item =
        q.item;

    let correctValue;


    if(
        questionType === "flagToCountry" ||
        questionType === "capitalToCountry"
    ){

        correctValue =
            item.country;

    }

    else if(
        questionType === "countryToFlag"
    ){

        correctValue =
            item.flag;

    }

    else{

        correctValue =
            item.capital;

    }


    const isCorrect =
        selected === correctValue;


    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(button => {

        button.classList.add("disabled");

        if(
            button.textContent ===
            correctValue
        ){

            button.classList.add("correct");

        }

        if(
            button.textContent ===
            selected &&
            !isCorrect
        ){

            button.classList.add("wrong");

        }

    });


    const correction =
        document.getElementById("correction");


    if(isCorrect){

        score += 1;

        correctAnswers += 1;

        correction.innerHTML =
            `<div class="correct-message">
                أحسنت! الإجابة صحيحة 🎉
             </div>`;

        /*
           لا ننطق الاختيار ثم الإجابة.
           ننطق جملة النجاح فقط.
        */

        speakCorrect();


        speechTimer =
            setTimeout(() => {

                currentQuestion++;

                showQuestion();

            }, 1500);

    }

    else{

        wrongAnswers += 1;

        correction.innerHTML =
            `<div class="wrong-message">
                خطأ ❌
             </div>`;

        /*
           ننطق "خطأ" فقط.
        */

        speakWrong();


        /*
           بعد ثانيتين ننطق الإجابة الصحيحة.
        */

        speechTimer =
            setTimeout(() => {

                speakCorrectAnswer(item);

                let answerText;


                if(
                    questionType === "flagToCountry" ||
                    questionType === "capitalToCountry"
                ){

                    answerText =
                        item.country;

                }

                else if(
                    questionType === "countryToFlag"
                ){

                    answerText =
                        `${item.country} ${item.flag}`;

                }

                else{

                    answerText =
                        item.capital;

                }


                correction.innerHTML =
                    `<div class="wrong-message">
                        خطأ ❌
                     </div>
                     <div class="correct-answer">
                        الإجابة الصحيحة:
                        ${answerText}
                     </div>`;


                /*
                   الانتقال للسؤال التالي
                   بعد عرض الإجابة الصحيحة.
                */

                speechTimer =
                    setTimeout(() => {

                        currentQuestion++;

                        showQuestion();

                    }, 2500);

            }, 2000);

    }

}


/* =====================================================
   النتيجة
===================================================== */

function showResult(){

    clearTimeout(speechTimer);

    speechSynthesis.cancel();

    document.getElementById("game").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";


    const total =
        questions.length;

    const percentage =
        Math.round(
            (score / total) * 100
        );


    document.getElementById("resultScore").textContent =
        `${percentage}%`;


    let text;


    if(percentage >= 90){

        text =
            `ممتاز جدًا! 🎉
             <br>
             ${score} من ${total}`;

    }

    else if(percentage >= 80){

        text =
            `ممتاز 👏
             <br>
             ${score} من ${total}`;

    }

    else if(percentage >= 70){

        text =
            `جيد جدًا 👍
             <br>
             ${score} من ${total}`;

    }

    else if(percentage >= 60){

        text =
            `جيد 🙂
             <br>
             ${score} من ${total}`;

    }

    else{

        text =
            `حاول مرة أخرى 💪
             <br>
             ${score} من ${total}`;

    }


    document.getElementById("resultText").innerHTML =
        text;

}
